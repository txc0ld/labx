[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
gas_reports = ["LabxMembership", "LabxRaffleHouse"]

# `LabxRaffleHouse` only fits under EIP-170 with IR codegen, and IR is the better codegen path anyway.
# It is scoped to `src/` on purpose: under `via_ir` the optimizer treats `block.timestamp` as constant for
# the whole function, which silently breaks test functions that call `vm.warp` between statements.
[[profile.default.additional_compiler_profiles]]
name = "src-via-ir"
via_ir = true
optimizer = true
optimizer_runs = 200

[[profile.default.compilation_restrictions]]
paths = "src/**"
via_ir = true

[profile.default.fuzz]
runs = 256
max_test_rejects = 200000

[profile.default.invariant]
runs = 32
depth = 32
fail_on_revert = false

[profile.ci.fuzz]
runs = 1024

[profile.ci.invariant]
runs = 64
depth = 64

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
multiline_func_header = "params_first"
sort_imports = false

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
anvil = "http://127.0.0.1:8545"

[etherscan]
sepolia = {key = "${ETHERSCAN_API_KEY}", chain = 11155111}
