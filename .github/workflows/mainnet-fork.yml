name: mainnet-fork

# Rehearses the mainnet deployment and one raffle against real chain-1 state (USDC, the Chainlink VRF v2.5 coordinator
# and the LABx Safe). Read-only: it forks public mainnet RPC state and broadcasts nothing.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - contracts/**
      - .github/workflows/mainnet-fork.yml

permissions:
  contents: read

jobs:
  mainnet-fork:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.5
      - run: forge test --match-contract DeployMainnet -vv
        env:
          MAINNET_FORK_RPC_URL: https://ethereum-rpc.publicnode.com
