name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.5
      # EIP-170: forge exits non-zero when any runtime exceeds 24,576 bytes.
      - run: forge build --sizes
      - run: forge test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  chain-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.5
      - run: npm ci
      - run: forge build --root ../contracts
      - run: npm test -- --maxWorkers=1
        env:
          RUN_CHAIN_INTEGRATION: "1"
          RUN_INDEPENDENT_WALLET_REVIEW_REPAIRS: "1"
          RUN_INDEPENDENT_TRANSACTION_LINEAGE: "1"

  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.5
      - run: npm ci
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: forge build --root ../contracts
      - run: |
          npm exec vitest -- run \
            test/activation-trust.browser.test.ts \
            test/independent-browser-journeys.test.ts \
            test/independent-browser-recovery.test.ts \
            test/independent-browser-catalog.test.ts \
            test/seller-portal.browser.test.ts \
            test/independent-seller-simplification.browser.test.ts \
            test/independent-five-tier-form.browser.test.ts \
            test/wallet-nft-picker.verification.browser.test.ts \
            test/private-record-feedback.browser.test.ts \
            test/buyer-ui-repairs.browser.test.ts \
            test/owner-review-race.browser.test.ts \
            test/safe-approval-handoff.browser.test.ts \
            test/independent-owner-review-race.browser.test.ts \
            test/independent-buyer-state.browser.test.ts \
            test/browser-chain-lifecycle.browser.test.ts \
            test/independent-transaction-outcomes.browser.test.ts \
            test/independent-transaction-lineage.browser.test.ts \
            test/independent-three-action-safe.browser.test.ts \
            test/wallet-restoration.browser.test.ts \
            --maxWorkers=1
        env:
          RUN_BROWSER_ACCEPTANCE: "1"
          RUN_SELLER_PORTAL_BROWSER: "1"
          RUN_INDEPENDENT_SELLER_SIMPLIFICATION_BROWSER: "1"
          RUN_WALLET_NFT_VERIFICATION: "1"
          RUN_PRIVATE_RECORDS_BROWSER: "1"
          RUN_BUYER_UI_REPAIRS_BROWSER: "1"
          RUN_OWNER_REVIEW_RACE_BROWSER: "1"
          RUN_SAFE_APPROVAL_BROWSER: "1"
          RUN_INDEPENDENT_OWNER_REVIEW_RACE_BROWSER: "1"
          RUN_INDEPENDENT_BUYER_STATE_BROWSER: "1"
          RUN_BROWSER_FIXTURE_LIFECYCLE: "1"
          RUN_INDEPENDENT_TRANSACTION_OUTCOMES_BROWSER: "1"
          RUN_INDEPENDENT_TRANSACTION_LINEAGE_BROWSER: "1"
          RUN_INDEPENDENT_THREE_ACTION_BROWSER: "1"
          RUN_WALLET_RESTORE_BROWSER: "1"
          LABX_WALLET_NFT_EVIDENCE_DIR: "../artifacts/wallet-nft-picker"
          LABX_SELLER_SIMPLIFICATION_EVIDENCE_DIR: "../artifacts/seller-simplification"
